<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Juan Santamaría el juego</title>
    </head>
    <body>
        <header>
            <a href="./index.html">
                <img src="../assets/icono-flecha-izquierda.png"
                    alt="regresar"
                    width="24"
                    height="24">
            </a>
        </header>

        <main>
            <!-- TODO: Hacerle el action y el method -->
            <form>
                <fieldset>
                    <legend>Elección del mapa</legend>

                    <!-- Cambiar mapa a la izquierda -->
                    <button type="button">
                        <img src="../assets/icono-flecha-izquierda.png"
                        alt="Cambiar mapa izquierda"
                        width="24"
                        height="24">
                    </button>
                    
                    <!--Aqui va la imagen del mapa-->
                    <img src="../assets/placeholder-imagen.png"
                    alt="Mapa seleccionado"
                    width="24"
                    height="24">
                    
                    <!-- Cambiar mapa a la derecha -->
                    <button type="button">
                        <img src="../assets/icono-flecha-derecha.png"
                        alt="Cambiar mapa derecha"
                        width="24"
                        height="24">
                    </button>
                </fieldset>

                <fieldset>
                    <legend>Configuracion de sala</legend>

                    <!-- Solo rondas impares -->
                    <label for="rondas">Rondas:</label>
                    <select id="rondas" name="rondas">
                        <option value="1">1</option>
                        <option value="3">3</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                    </select>
                    <br>

                    <!-- Duración de ronda -->
                    <label for="duracion">Duración de ronda:</label>
                    <select id="duracion" name="duracion">
                        <option value="60">60s</option>
                        <option value="90">90s</option>
                        <option value="120">120s</option>
                    </select>
                    <br>
                    
                    <!-- Modalidad -->
                    <label for="modalidad">Modalidad:</label>
                    <select id="modalidad" name="modalidad">
                        <option value="facil">Fácil</option>
                        <option value="media">Media</option>
                        <option value="dificil">Difícil</option>
                    </select>
                    <br>
                </fieldset>


                <button type="button">Crear sala</button>
            </form>
        </main> 

        <footer>© 2026 Juan Santamaría el juego</footer>
        
    </body>
</html>
