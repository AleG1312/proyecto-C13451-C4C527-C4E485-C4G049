<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin de partida - Juan Santamaría el juego</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <header>
        <a href="partida.html" class="back" aria-label="regresar">
            <img src="../assets/icono-flecha-izquierda.png" alt="regresar" class="icon-back" width="24" height="24">
        </a>

        <button type="button" class="settings" aria-label="configuracion">
            <img src="../assets/icono-configuracion.png" alt="configuracion" class="icon-settings" width="24" height="24">
        </button>

        <h1>Fin de partida</h1>
    </header>

    <main>
        <section>
            <h2>Jugadores</h2>

            <!-- Jugador 1 (izquierda en el diseño) -->
            <article>
                <h3>Jugador 1</h3>
                <img src="../assets/placeholder-imagen.png"
                    alt="Imagen del jugador 1"
                    width="40"
                    height="40">
                <p>Rondas ganadas: 12</p>
            </article>

            <!-- Jugador 2 (derecha en el diseño) -->
            <article>
                <h3>Jugador 2</h3>
                <img src="../assets/placeholder-imagen.png"
                    alt="Imagen del jugador 2"
                    width="40"
                    height="40">
                <p>Rondas ganadas: 8</p>
            </article>

            <p><strong>Ganador de la partida:</strong> Jugador 1</p>
        </section>

        <!-- nav usado dentro de main por el estilo de menú de videojuego-->
        <nav>
            <ul>
                <li><a href="index.html">Jugar de nuevo</a></li>
            </ul>
        </nav>
    </main>

    <footer>© 2026 Juan Santamaría el juego</footer>
</body>

</html>
