<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es" xml:lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sala de espera | Juan Santamaría el juego</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
</head>

<body>
    <header>
      <a class="volver" href="index.html">
        <img src="../assets/icono-flecha-izquierda.png"
            alt="Salir de la sala"
            width="24"
            height="24" />
      </a>

      <p class="codigo-sala"><strong>ID: XXXX</strong></p>

      <a class="configuracion" href="configuracion_sala.html">
        <img src="../assets/icono-configuracion.png"
            alt="Configuración de la sala"
            width="24"
            height="24" />
      </a>
    </header>

  <main>
    <h1>Sala de espera</h1>

    <section class="sala">
      <h2>Jugadores</h2>
      <img src="../assets/icono-usuario.png"
          alt="Corredor: Juan Santamaría"
          class="sala__avatar"
          width="48"
          height="48" />
      <p class="sala__nombre">#1: XXXX</p>

      <img src="../assets/placeholder-imagen.png"
          alt="Vista previa del mapa"
          class="sala__mapa"
          width="100"
          height="100" />

      <img src="../assets/icono-usuario.png"
          alt="Atrapador: William Walker"
          class="sala__avatar"
          width="48"
          height="48" />
      <p class="sala__nombre">#2: XXXX</p>
    </section>

    <section class="cuenta-regresiva">
      <h2>La partida empieza en</h2>

      <time datetime="PT30S"> 
      <img src="../assets/clock.png"
          alt=""
          width="24"
          height="24" />0:30</time>

      <a href="game.html">Iniciar partida</a>
    </section>
  </main>

  <footer>
    <p><small>© <time datetime="2026">2026</time> Juan Santamaría el juego.
        Proyecto del curso <abbr title="Desarrollo de Aplicaciones Web">CI-0137</abbr>,
        <abbr title="Universidad de Costa Rica">UCR</abbr>.</small></p>
  </footer>

</body>

</html>
